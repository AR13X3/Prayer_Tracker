# Version catalog — the single place to bump dependency versions.
#
# These are pinned to known-good values as of Aug 2026. If Android Studio's Gradle
# sync flags any as outdated/incompatible, accept its suggestion or bump here — the
# AGP Upgrade Assistant handles agp/gradle together. The two most likely to need a
# nudge for your installed Android Studio are `agp` and `composeBom`.

[versions]
agp = "8.10.1"   # KSP 2.3.11 requires AGP >= 8.10.0; 8.10.x still works with Gradle 8.11.1
kotlin = "2.3.20"                # kotlin-compose & serialization plugins track this exact version
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
splashscreen = "1.0.1"          # backports the Android 12 splash screen to API 23+
composeBom = "2026.06.00"
navigationCompose = "2.8.5"
coroutines = "1.9.0"
serializationJson = "1.11.0"    # matches the version supabase-kt pulls transitively; needs Kotlin 2.3.20+

# On-device prayer-time calculation. adhan2 0.0.6 returns kotlin.time.Instant (no extra datetime dep).
adhan = "0.0.6"

# Offline cache. KSP switched to decoupled versioning at 2.3.0 (no more <kotlin>-<ksp> suffix);
# 2.3.x targets the Kotlin 2.3.x line. If KSP reports a Kotlin-compat error, bump to the newest
# 2.3.x from https://github.com/google/ksp/releases.
ksp = "2.3.11"
room = "2.8.4"

# supabase-kt 3.x renamed gotrue-kt -> auth-kt. The BOM manages all supabase module versions.
supabase = "3.7.0"
# Ktor engine version must be compatible with the Ktor that supabase-kt 3.7.0 depends on.
# If you hit Ktor NoClassDefFound / linkage errors, check the supabase-kt 3.7.0 release
# notes and set this to the Ktor version it was built against.
ktor = "3.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# supabase-kt (BOM + modules; modules take their version from the BOM)
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }

adhan2 = { group = "com.batoulapps.adhan", name = "adhan2", version.ref = "adhan" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
